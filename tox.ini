[tox]
envlist = py38,py39,py310,py311
skipsdist = True

[testenv]
deps =
    pytest
    pytest-cov
    black
    isort
    flake8
    mypy
commands =
    pytest --cov=trolyso tests/
    black --check trolyso tests/
    isort --check-only trolyso tests/
    flake8 trolyso tests/
    mypy trolyso tests/

[testenv:format]
deps =
    black
    isort
commands =
    black trolyso tests/
    isort trolyso tests/

[testenv:lint]
deps =
    flake8
    mypy
commands =
    flake8 trolyso tests/
    mypy trolyso tests/

[testenv:test]
deps =
    pytest
    pytest-cov
commands =
    pytest --cov=trolyso tests/

[flake8]
max-line-length = 88
extend-ignore = E203
exclude = .git,__pycache__,build,dist

[mypy]
python_version = 3.8
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true 