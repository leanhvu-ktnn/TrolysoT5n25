<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="github-logo.png" alt="GitHub Logo">
            </div>
            <div class="search">
                <input type="text" placeholder="Search or jump to...">
            </div>
            <div class="nav-links">
                <a href="#">Pull requests</a>
                <a href="#">Issues</a>
                <a href="#">Marketplace</a>
                <a href="#">Explore</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="profile-section">
                <img src="profile-pic.png" alt="Profile Picture" class="profile-pic">
                <h1>Your Name</h1>
                <p>@yourusername</p>
            </div>

            <div class="repositories">
                <h2>Repositories</h2>
                <div class="repo-list">
                    <!-- Repository items will be added here -->
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 GitHub, Inc.</p>
    </footer>
</body>
</html>
